<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WhatsApp Chat Stats</title>
  <link rel="stylesheet" href="styles/analysis.css">
</head>
<body>
  <!-- Top Section: Dark background for controls -->
  <div class="top-section">
    <div class="parallax-bg"></div>
    
    <div class="upload-container">
      <div class="upload-content">
        <h1>Analyze Your WhatsApp Chats</h1>
        <p class="subtitle">Upload your chat history to unlock AI-powered insights</p>
        
        <div class="upload-area" id="dropZone">
          <div class="upload-icon">📁</div>
          <p id="upload-text">Drag & drop your .txt or .zip file here</p>
          <span>or</span>
          <input type="file" id="fileInput" accept=".txt, .zip" hidden>
          <button class="cta-button" onclick="document.getElementById('fileInput').click()">Select File</button>
        </div>
        
        <div class="file-info" id="fileInfo">
          <div class="file-icon">📄</div>
          <span id="fileName"></span>
          <button class="clear-file" id="clearFile">✕</button>
        </div>
        
        <div class="action-buttons">
          <div id="signin-button" class="signin-button"></div>
          <button id="processButton" class="cta-button process-button" disabled>Analyze Chat</button>
        </div>
        
        <div class="security-notice">
          <div class="security-icon">🔒</div>
          <p>Your data is processed securely and never stored permanently</p>
        </div>
        
        <div class="format-selector">
          <label for="regionSelect">Date Format:</label>
          <select id="regionSelect">
            <option value="EU">European (DD/MM/YYYY)</option>
            <option value="US">American (MM/DD/YYYY)</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Bottom Section: Light background for results and charts -->
  <div class="container">
    <div id="results"></div>

    <!-- Timeline Section: Date & Times charts -->
    <div id="timelineSection" class="chart-container">
      <div class="chart-container">
          <!-- Column Chart (Evolution over time) -->
          <div id="personSelectionContainer"></div>
          <div class="spacer"></div>
          <div id="columnchartdiv"></div>
          <div class="spacer"></div>
          <div id="monthlychartdiv"></div>
          <div class="spacer"></div>
          <!-- Weekday Chart -->
          <div id="weekdaychartdiv"></div>
          <!-- Spacer -->
          <div class="spacer"></div>
          <!-- Hourly Chart -->
          <div id="hourlychartdiv"></div>
          <!-- Legend Container for stacked charts -->
          <div id="legendContainer"></div>
      </div>
    </div>

    <!-- Chat Analytics Section -->
    <div id="chatAnalyticsSection">
      <!-- The title will be inserted dynamically once the file is processed -->
      <div id="personBoxesContainer">
          <!-- Person boxes will be dynamically added here -->
      </div>

      <!-- Communal Words Section -->
      <div id="communalWordsContainer">
        <div id="communalWords"></div>
      </div>

      <!-- Floating Emojis Section -->
      <div id="floatingEmojisContainer">
        <div id="floatingEmojis"></div>
      </div>
    </div>

    <!-- Content Analysis Section -->
    <div id="contentAnalysisSection">
      <!-- Content Analysis stats will be dynamically added here -->
    </div>
  </div>

    <!-- AI Analysis Section -->
  <!-- <div id="aiAnalysisSection">
    <h2 class="title subtitle">AI Analysis</h2>
    <div id="aiAnalysisContainer">
      <button id="aiAnalysisButton" class="ai-button">Analyze with AI</button>
      <div id="aiResultsContainer" class="ai-results-container"></div>
    </div>
  </div> -->
  <!-- Dummy content to ensure scrolling -->
  <div style="height: 2000px;"></div>

  <!-- Include amCharts -->
  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/percent.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

  <!-- Include JSZip for ZIP file support -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


  <script type="module" src="scripts/analysis/fileProcessor.js"></script>
  <script src="scripts/analysis/chartRenderer.js"></script>
  <script type="module" src="scripts/analysis/parallax.js"></script>
</body>
</html>
